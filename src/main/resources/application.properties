
spring.application.name=api-gateway

server.port=8090

# Identity Service - 8091
spring.cloud.gateway.server.webmvc.routes[0].id=identity-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8091
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

# Content Service - 8092
spring.cloud.gateway.server.webmvc.routes[1].id=content-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8092
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/content/**

# Product Service - 8093
spring.cloud.gateway.server.webmvc.routes[2].id=product-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8093
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products/**

# Order Service - 8094
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8094
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**
